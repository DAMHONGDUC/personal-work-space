name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Verification runs here rather than in a parallel workflow, so a failure
      # stops the deploy instead of racing it. This is also the only check a
      # push straight to main gets, since CI now only runs on pull requests.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Generate the CV LaTeX
        run: npm run cv:tex

      - name: Compile the CV
        uses: xu-cheng/latex-action@v3
        with:
          # One folder per CV under cv/build, so every version in the switcher
          # is typeset — and broken data in any of them fails here.
          root_file: cv/build/*/main.tex
          work_in_root_file_dir: true
          glob_root_file: true

      - name: Publish the CV
        # public/ is copied into the export, so the PDF and the page images have
        # to land before the site build runs. The images are what /personal/cv
        # renders inline; the PDF is the download.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          node scripts/publish-cv-pdf.mts
          node scripts/build-cv-images.mts

      - name: Build static export
        # A project site is served from /<repo>, so the app needs that prefix.
        # A custom domain serves from the root, so leave it empty there.
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Uploading to the effects library. Public by design — they ship in
          # the page — so repository variables, not secrets. Left unset, the
          # Upload button simply is not shown.
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
