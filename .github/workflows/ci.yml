name: CI

# Pull requests only. A push to main is covered by the deploy workflow, which
# runs the same checks before it publishes — running them here too would just
# compile the CV a second time, in parallel, without gating anything.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Generate the CV LaTeX
        run: npm run cv:tex

      - name: Compile the CV
        # The only place the CV is typeset with pdfLaTeX, the same engine
        # Overleaf uses. Broken CV data has to fail here, before the merge,
        # rather than at deploy time.
        uses: xu-cheng/latex-action@v3
        with:
          # One folder per CV under cv/build, so every version in the switcher
          # is typeset — and broken data in any of them fails here.
          root_file: cv/build/*/main.tex
          work_in_root_file_dir: true
          glob_root_file: true

      - name: Publish the CV
        # Mirrors the deploy exactly, so the build below sees the same public/
        # it will see on main and a failure is caught before merge.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          node scripts/publish-cv-pdf.mts
          node scripts/build-cv-images.mts

      - name: Upload the CV for review
        # always(), so a failure in a later step still hands over a PDF that
        # compiled — that is usually the artefact you want to look at to work
        # out what went wrong. Nothing to upload if the compile itself failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: cv/build/*/main.pdf
          if-no-files-found: ignore

      - name: Build
        run: npm run build
